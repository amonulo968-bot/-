<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LUMO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="67.png">
</head>
<body>
<div class="app" id="app">

  <section class="screen active" id="notes">
    <header class="nh">
      <div><h1 class="big" data-i18n="myNotes"></h1><p class="meta" id="notesMeta"></p></div>
      <button class="icon-btn more" id="moreBtn" aria-label="More"><svg class="i"><use href="#dots"/></svg></button>
      <div class="menu" id="moreMenu">
        <button id="exportBtn" data-i18n="export"></button>
        <button id="importBtn" data-i18n="import"></button>
      </div>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </header>
    <div class="search"><input id="homeSearch" type="search" data-i18n-ph="searchPh" autocomplete="off"><button class="sortbtn" id="sortBtn" aria-label="Sort"><svg class="i"><use href="#sort"/></svg></button><div class="menu" id="sortMenu"></div></div>
    <div class="list" id="notesList"></div>
    <button class="primary" id="newNote"><svg class="i"><use href="#plus"/></svg><span data-i18n="newNote"></span></button>
  </section>

  <section class="screen" id="tasks">
    <header>
      <h1 data-i18n="tasks"></h1>
      <p class="meta" id="tasksMeta"></p>
    </header>
    <div class="list" id="tasksList"></div>
    <button class="primary" id="addTask"><svg class="i"><use href="#plus"/></svg><span data-i18n="addTask"></span></button>
  </section>

  <section class="screen" id="settings">
    <header><h1 data-i18n="settings"></h1></header>
    <div class="list">
      <div class="card row"><span data-i18n="theme"></span>
        <div class="seg" id="segTheme"><button data-v="light" data-i18n="light"></button><button data-v="dark" data-i18n="dark"></button></div></div>
      <div class="card row"><span data-i18n="language"></span>
        <div class="seg" id="segLang"><button data-v="ru">Русский</button><button data-v="en">English</button></div></div>
      <div class="card row" id="vibRow"><span class="vl"><span data-i18n="vibration"></span><svg class="i chev-r"><use href="#chevron"/></svg></span><input type="checkbox" class="switch" id="setVib"></div>
      <button class="card row" id="openTrash"><span data-i18n="trash"></span><span class="rv" id="trashCount"></span></button>
      <div class="card row"><span data-i18n="accent"></span>
        <div class="swatches" id="swatches">
          <button data-v="violet" style="--c:#4F3EE0" aria-label="Violet"></button>
          <button data-v="blue" style="--c:#2F6BFF" aria-label="Blue"></button>
          <button data-v="green" style="--c:#12A66A" aria-label="Green"></button>
          <button data-v="orange" style="--c:#E8610A" aria-label="Orange"></button>
          <button data-v="pink" style="--c:#E13C8C" aria-label="Pink"></button>
        </div></div>
      <button class="card row danger" id="resetData" data-i18n="reset"></button>
    </div>
  </section>

  <section class="screen" id="trash">
    <header class="theader">
      <button class="icon-btn" id="trashBack" aria-label="Back"><svg class="i"><use href="#chevron"/></svg></button>
      <h1 data-i18n="trash"></h1>
    </header>
    <p class="meta tmeta" data-i18n="trashNote"></p>
    <div class="list" id="trashList"></div>
    <button class="textbtn" id="emptyTrash" data-i18n="emptyTrash"></button>
  </section>

  <section class="screen editor" id="editor">
    <div class="ebar">
      <button class="icon-btn" id="back" aria-label="Back"><svg class="i"><use href="#chevron"/></svg></button>
      <span id="barTitle"></span>
      <button class="icon-btn" id="menuBtn" aria-label="Delete"><svg class="i"><use href="#bin"/></svg></button>
    </div>
    <div class="ebody">
      <input id="eTitle" class="etitle" data-i18n-ph="titlePh" autocomplete="off">
      <textarea id="eText" class="etext" data-i18n-ph="textPh"></textarea>
    </div>
  </section>

  <div class="sheet" id="vibSheet">
    <div class="scrim" data-close></div>
    <div class="panel">
      <h2 class="sheet-h" data-i18n="vibWhat"></h2>
      <div class="vlist">
        <label class="card row"><span data-i18n="vibChecks"></span><input type="checkbox" class="switch" data-vib="checks"></label>
        <label class="card row"><span data-i18n="vibDel"></span><input type="checkbox" class="switch" data-vib="del"></label>
        <label class="card row"><span data-i18n="vibSave"></span><input type="checkbox" class="switch" data-vib="save"></label>
      </div>
      <button class="primary" id="vibDone" data-i18n="done"></button>
    </div>
  </div>

  <div class="toast" id="toast"><span id="toastMsg"></span><button id="toastBtn"></button></div>
  <div class="banner" id="banner" hidden><span id="bannerMsg"></span><button id="bannerX" aria-label="Close"><svg class="i"><use href="#x"/></svg></button></div>

  <nav id="nav">
    <button data-tab="notes" class="active" aria-label="Notes"><svg class="i"><use href="#home"/></svg></button>
    <button data-tab="tasks" aria-label="Tasks"><svg class="i"><use href="#check"/></svg></button>
    <button data-tab="settings" aria-label="Settings"><svg class="i"><use href="#gear"/></svg></button>
  </nav>

  <div class="sheet" id="sheet">
    <div class="scrim" id="scrim"></div>
    <div class="panel">
      <input id="sTitle" class="stitle" data-i18n-ph="taskPh" autocomplete="off">
      <ul class="clist" id="sChecks"></ul>
      <input id="sAdd" class="cadd" data-i18n-ph="checkPh" autocomplete="off">
      <div class="sbtns">
        <button class="ghost" id="sCancel" data-i18n="cancel"></button>
        <button class="primary" id="sSave" data-i18n="save"></button>
      </div>
    </div>
  </div>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="home" viewBox="0 0 24 24"><path d="M5 10.5 12 4l7 6.5V20H5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" transform="translate(1.2 1.2) scale(.9)"/></symbol>
    <symbol id="chevron" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="chev-d" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="bin" viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="sort" viewBox="0 0 24 24"><path d="M4 7h16M7 12h10M10 17h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="dots" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.9" fill="currentColor"/><circle cx="12" cy="12" r="1.9" fill="currentColor"/><circle cx="19" cy="12" r="1.9" fill="currentColor"/></symbol>
    <symbol id="x" viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  </defs>
</svg>
<script src="script.js"></script>
</body>
</html>
